[package]
name = "pico-nervogate"
version = "0.1.0"
edition = "2021"
description = "A tiny (<1MB) multi-protocol LLM gateway with full HTTP header pass-through and request/response translation."
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tokio-stream = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bytes = "1"
async-stream = "0.3"

[dev-dependencies]
# `oneshot` drives the router in-process, so error-shape tests need no socket.
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
